{% if review_navigation is defined %}
<nav class="review-day-nav" aria-label="Review day navigation">
    <div class="review-day-nav__arrows">
        {% if review_navigation.older_url %}
        <a class="btn btn--secondary" href="{{ review_navigation.older_url }}" aria-label="Previous day with open events">← Older day</a>
        {% else %}
        <span class="btn btn--secondary" aria-disabled="true">← Older day</span>
        {% endif %}
        {% if review_navigation.newer_url %}
        <a class="btn btn--secondary" href="{{ review_navigation.newer_url }}" aria-label="Next day with open events">Newer day →</a>
        {% else %}
        <span class="btn btn--secondary" aria-disabled="true">Newer day →</span>
        {% endif %}
    </div>
    <form class="review-day-nav__form" method="get" action="{{ url_for('review.review_page') }}">
        {% if not review_navigation.is_grid_layout %}
        <input type="hidden" name="layout" value="legacy">
        {% endif %}
        <label for="review-day">Day</label>
        <select class="form-control" id="review-day" name="day">
            <option value="all" {% if review_navigation.selected_day == 'all' %}selected{% endif %}>All days ({{ review_navigation.total_events }})</option>
            {% if review_navigation.selected_day != 'all' and review_navigation.selected_day not in (review_navigation.days | map(attribute=0) | list) %}
            <option value="{{ review_navigation.selected_day }}" selected>{{ review_navigation.selected_day }} (0)</option>
            {% endif %}
            {% for date, count in review_navigation.days %}
            <option value="{{ date }}" {% if date == review_navigation.selected_day %}selected{% endif %}>{{ date }} ({{ count }})</option>
            {% endfor %}
        </select>
        <label for="review-sort">Sort</label>
        <select class="form-control" id="review-sort" name="sort">
            <option value="chronological" {% if review_navigation.sort_order == 'chronological' %}selected{% endif %}>Chronological</option>
            <option value="priority" {% if review_navigation.sort_order == 'priority' %}selected{% endif %}>Review priority</option>
        </select>
        <button type="submit" class="btn btn--secondary">Apply</button>
    </form>
</nav>
{% endif %}
