name: Docker Quick Build push false

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-quick-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: metadata
        run: |
          set -euo pipefail
          VERSION=$(bash scripts/version_info.sh dev-version . "$GITHUB_SHA")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Docker image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=starminworks/watchmybirds:buildcache
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}

      - name: Write job summary
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          {
            echo "## Docker build validation"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $BUILD_VERSION"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Publication: disabled"
            echo "- No downloadable image artifact or container runtime smoke test is produced."
          } >> "$GITHUB_STEP_SUMMARY"
