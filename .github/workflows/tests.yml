name: Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      # host_env covers tests asserting on the host's mount table or on civil
      # twilight at the station's coordinates. They pass on a developer machine
      # and on the appliance, but a hosted runner has neither.
      - name: Run test suite
        run: pytest -q -m "not host_env"

  telemetry-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/telemetry-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Test Worker with local D1 databases
        run: npm test
